<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <defs>
    <!-- Gradients for depth and modern look -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dce82;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    
    <!-- Speedometer gradient from green to yellow to red -->
    <linearGradient id="speedometerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main location pin shape with shadow -->
  <g filter="url(#shadow)">
    <path d="M 100 20 
             C 75 20, 55 40, 55 65 
             C 55 75, 58 84, 63 92
             L 63 92
             C 70 105, 85 130, 100 160
             C 115 130, 130 105, 137 92
             L 137 92
             C 142 84, 145 75, 145 65
             C 145 40, 125 20, 100 20 Z"
          fill="url(#pinGradient)"
          stroke="#1e8449"
          stroke-width="2"/>
  </g>
  
  <!-- Highlight on pin for glossy effect -->
  <path d="M 100 20 
           C 75 20, 55 40, 55 65 
           C 55 75, 58 84, 63 92
           L 63 92
           C 70 105, 85 130, 100 160
           C 115 130, 130 105, 137 92
           L 137 92
           C 142 84, 145 75, 145 65
           C 145 40, 125 20, 100 20 Z"
        fill="url(#highlightGradient)"
        stroke="none"/>
  

  
  <!-- Inner circle background - semi-transparent for theme adaptation -->
  <circle cx="100" cy="65" r="28" 
          fill="#ffffff" 
          stroke="none"
          opacity="0.5"/>

  
  <!-- Leaf design - more refined and organic -->
  <g transform="translate(100, 65)">
    <!-- Leaf outline for contrast -->
    <path d="M 0 -22
             C -4 -22, -10 -20, -14 -12
             C -17 -5, -18 5, -16 13
             C -14 20, -8 25, 0 27
             C 8 25, 14 20, 16 13
             C 18 5, 17 -5, 14 -12
             C 10 -20, 4 -22, 0 -22 Z"
          fill="none"
          stroke="#1e8449"
          stroke-width="2"/>
    
    <!-- Main leaf body with gradient -->
    <path d="M 0 -22
             C -4 -22, -10 -20, -14 -12
             C -17 -5, -18 5, -16 13
             C -14 20, -8 25, 0 27
             C 8 25, 14 20, 16 13
             C 18 5, 17 -5, 14 -12
             C 10 -20, 4 -22, 0 -22 Z"
          fill="url(#leafGradient)"
          stroke="none"/>
    
    <!-- Leaf center vein -->
    <path d="M 0 -20 Q -1 0, 0 24"
          stroke="#1e8449"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round"/>
    
    <!-- Left side veins -->
    <path d="M -1 -10 Q -7 -5, -10 0"
          stroke="#1e8449"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"
          opacity="0.8"/>
    
    <path d="M -1 3 Q -7 8, -9 13"
          stroke="#1e8449"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"
          opacity="0.8"/>
    
    <!-- Right side veins -->
    <path d="M 1 -10 Q 7 -5, 10 0"
          stroke="#1e8449"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"
          opacity="0.8"/>
    
    <path d="M 1 3 Q 7 8, 9 13"
          stroke="#1e8449"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"
          opacity="0.8"/>
    
    <!-- Leaf highlight for depth -->
    <ellipse cx="-4" cy="-8" rx="5" ry="7"
             fill="#ffffff"
             opacity="0.4"/>
  </g>
  
  <!-- Subtle speedometer arc at bottom for "drive" context -->
  <g opacity="0.6">
    <path d="M 65 145 Q 70 160, 100 165 Q 130 160, 135 145"
          stroke="url(#speedometerGradient)"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"/>
    <circle cx="68" cy="148" r="2.5" fill="#27ae60"/>
    <circle cx="100" cy="162" r="2.5" fill="#f39c12"/>
    <circle cx="132" cy="148" r="2.5" fill="#e74c3c"/>
  </g>
</svg>